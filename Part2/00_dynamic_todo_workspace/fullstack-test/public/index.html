<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f6ef"><title>Momentum — Tasks with clarity</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="shell">
<aside class="sidebar" id="sidebar"><a class="brand" href="#"><span class="logo">M</span><span>Momentum</span></a><button class="new-btn" id="openComposer"><span>＋</span> New task <kbd>N</kbd></button>
<nav aria-label="Task views"><p class="eyebrow">Workspace</p><button class="nav active" data-view="all"><span>⌂</span> My tasks <b id="allCount">0</b></button><button class="nav" data-view="today"><span>◷</span> Today <b id="todayCount">0</b></button><button class="nav" data-view="upcoming"><span>⌁</span> Upcoming</button><button class="nav" data-view="done"><span>✓</span> Completed</button><p class="eyebrow">Focus</p><button class="nav" data-view="high"><span class="dot red"></span> High priority</button><button class="nav" data-view="medium"><span class="dot amber"></span> Medium priority</button><button class="nav" data-view="low"><span class="dot green"></span> Low priority</button></nav>
<div class="sidebar-foot"><div class="progress-ring"><span id="progressValue">0%</span></div><div><strong>Daily progress</strong><small id="progressCopy">A fresh start</small></div></div></aside>
<main><header><button class="icon mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search tasks…" aria-label="Search tasks"><kbd>/</kbd></div><div class="header-actions"><button class="icon" id="themeBtn" aria-label="Toggle color theme">☼</button><div class="avatar" title="Your workspace">JD</div></div></header>
<section class="content"><div class="hero"><div><p class="date" id="dateLabel"></p><h1 id="viewTitle">My tasks</h1><p id="viewSubtitle">Make space for what matters.</p></div><button class="primary" id="heroAdd">＋ Add task</button></div>
<div class="stats"><article><span class="stat-icon lavender">↗</span><div><strong id="remainingStat">0</strong><small>Tasks remaining</small></div></article><article><span class="stat-icon mint">✓</span><div><strong id="completedStat">0</strong><small>Completed</small></div></article><article><span class="stat-icon peach">⚡</span><div><strong id="focusStat">0</strong><small>High priority</small></div></article></div>
<div class="toolbar"><div class="segments"><button class="segment active" data-status="all">All</button><button class="segment" data-status="todo">To do</button><button class="segment" data-status="in-progress">In progress</button></div><select id="sort" aria-label="Sort tasks"><option value="smart">Sort: Smart</option><option value="due">Due date</option><option value="priority">Priority</option><option value="newest">Newest</option></select></div>
<div id="taskList" class="task-list" aria-live="polite"></div><div class="empty" id="empty" hidden><div>✓</div><h2>Clear space, clear mind.</h2><p>No tasks match this view. Add one or enjoy the calm.</p><button class="primary" id="emptyAdd">Add a task</button></div></section></main></div>
<dialog id="taskDialog"><form id="taskForm"><div class="modal-head"><div><p class="eyebrow">Task details</p><h2 id="modalTitle">Create a task</h2></div><button type="button" class="icon" id="closeDialog" aria-label="Close">×</button></div><label>What needs doing?<input id="titleInput" name="title" required maxlength="160" placeholder="e.g. Prepare launch brief" autofocus></label><label>Notes<textarea name="notes" rows="3" maxlength="2000" placeholder="Add context, links, or a definition of done…"></textarea></label><div class="form-grid"><label>Due date<input name="dueDate" type="date"></label><label>Priority<select name="priority"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select></label></div><label>Tags<input name="tags" placeholder="Design, Personal (comma separated)"></label><div class="modal-actions"><button type="button" class="secondary" id="cancelDialog">Cancel</button><button class="primary" type="submit">Save task</button></div></form></dialog>
<div class="toast" id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
